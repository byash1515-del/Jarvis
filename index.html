<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jarvis">
  <meta name="theme-color" content="#02060c">
  <title>J.A.R.V.I.S.</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="scanline" aria-hidden="true"></div>

  <header class="hud-top">
    <div class="brand">
      <span class="brand-title">J.A.R.V.I.S.</span>
      <span class="brand-sub">Just A Rather Very Intelligent System</span>
    </div>
    <div class="hud-meta">
      <span id="clock" class="mono">--:--:--</span>
      <span id="link-status" class="pill">OFFLINE</span>
      <button id="settings-btn" class="icon-btn" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
   <div class="left">
    <section class="core-wrap">
      <div class="ring ring-1" aria-hidden="true"></div>
      <div class="ring ring-2" aria-hidden="true"></div>
      <div class="ring ring-3" aria-hidden="true"></div>
      <div class="ticks" aria-hidden="true"></div>
      <button id="talk-btn" class="core" data-state="idle" aria-label="Tap to talk">
        <span class="core-inner">
          <svg class="mic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a.9.9 0 0 0-1.8 0 4.2 4.2 0 0 1-8.4 0 .9.9 0 0 0-1.8 0 6 6 0 0 0 5.1 5.9V20H8.5a.9.9 0 0 0 0 1.8h7a.9.9 0 0 0 0-1.8h-2.6v-2.6a6 6 0 0 0 5.1-5.9Z"/></svg>
          <span id="core-label" class="core-label">TAP TO TALK</span>
        </span>
      </button>
    </section>

    <p id="status" class="status mono">STANDING BY</p>
    <p id="interim" class="interim" aria-live="polite"></p>

    <div id="link-card" class="link-card hidden">
      <span id="link-card-text">Safari blocked the new tab.</span>
      <a id="link-card-a" href="#" target="_blank" rel="noopener" class="btn primary">Open</a>
      <button id="link-card-close" class="icon-btn small" aria-label="Dismiss">✕</button>
    </div>
   </div>

    <section class="log-panel">
      <div class="panel-head">
        <span>COMMS LOG</span>
        <button id="clear-btn" class="link-btn">CLEAR MEMORY</button>
      </div>
      <div id="log" class="log" aria-live="polite"></div>
      <form id="text-form" class="text-form" autocomplete="off">
        <input id="text-input" type="text" placeholder="Or type a command, sir…" enterkeyhint="send">
        <button type="submit" class="btn">SEND</button>
      </form>
    </section>
  </main>

  <dialog id="settings" class="settings">
    <form method="dialog" id="settings-form">
      <h2>SYSTEM SETTINGS</h2>

      <label for="api-key">Gemini API key</label>
      <input id="api-key" type="password" placeholder="Paste your key (AIza…)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="hint">Stored only in this browser's localStorage. Get a free key at
        <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.</p>

      <label for="model">Model</label>
      <input id="model" type="text" autocapitalize="off" spellcheck="false">
      <p class="hint">Default <code>gemini-flash-latest</code>. Try <code>gemini-2.5-flash</code> if needed.</p>

      <label for="voice">Voice</label>
      <select id="voice"></select>

      <label for="rate">Speech rate <span id="rate-val" class="mono"></span></label>
      <input id="rate" type="range" min="0.7" max="1.4" step="0.05">

      <label for="listen-lang">Recognition language</label>
      <input id="listen-lang" type="text" placeholder="en-US" autocapitalize="off" spellcheck="false">

      <div class="settings-actions">
        <button type="button" id="test-voice" class="btn">TEST VOICE</button>
        <button type="button" id="forget-key" class="btn danger">FORGET KEY</button>
        <button type="submit" id="save-settings" class="btn primary">SAVE</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
